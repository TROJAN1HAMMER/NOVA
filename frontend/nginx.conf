server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness target — nginx itself being up to
    # answer this is a sufficient check for a static SPA (there's no
    # downstream dependency for a static file server to be "not ready" for).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: any path that isn't a real static file falls back to
    # index.html so client-side routing (react-router or similar) can
    # handle it — without this, a hard refresh on any non-root path 404s.
    #
    # `no-cache` here is deliberate (not a leftover default): index.html
    # references the *current* build's content-hashed JS/CSS filenames, and
    # every deploy produces new hashes. Without an explicit directive,
    # browsers apply their own heuristic freshness window to this response
    # and can keep serving a stale index.html — pointing at a previous
    # build's hashed assets — well after a new version has been deployed,
    # making a real code change invisible to a returning visitor until they
    # hard-refresh. `no-cache` (not `no-store`) still lets the browser cache
    # the file, but forces a conditional revalidation (ETag/Last-Modified)
    # against nginx on every request, so a genuinely-unchanged index.html
    # is still served cheaply (304), while a changed one is always caught
    # immediately. The hashed static assets below keep their own long,
    # immutable cache — once fetched for a given hash they never change.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
