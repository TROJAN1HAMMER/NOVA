name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend: syntax + tests ────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          # pytest collection must not require a live Postgres/Redis —
          # anything that does belongs behind a marker excluded here, or
          # in a separate integration-test job with service containers.
          DATABASE_URL: postgresql+asyncpg://kavach:kavach_secret@localhost:5432/kavach_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v
