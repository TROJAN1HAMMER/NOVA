name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the cluster after a successful build"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  # ── Backend: syntax + tests ────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          # pytest collection must not require a live Postgres/Redis —
          # anything that does belongs behind a marker excluded here, or
          # in a separate integration-test job with service containers.
          DATABASE_URL: postgresql+asyncpg://kavach:kavach_secret@localhost:5432/kavach_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  # ── Helm chart validation — runs on every PR, no registry/cluster access needed ──
  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.4"

      - name: helm lint
        run: helm lint helm/kavach

      - name: helm template (default values)
        run: helm template kavach helm/kavach --namespace kavach

      - name: helm template (production-shaped values — S3 reports, no in-cluster Postgres/Redis, external secret)
        run: |
          helm template kavach helm/kavach --namespace kavach \
            --set postgres.enabled=false \
            --set redis.enabled=false \
            --set config.reportStorageBackend=s3 \
            --set storage.reports.emptyDir=true \
            --set secrets.existingSecret=kavach-external-secret

  # ── Build + push images (main branch only — PRs just build, to catch
  #    Dockerfile breakage, without pushing anything) ──────────────────────────
  build-backend:
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy — only on main, and only if the cluster secrets are present.
  #    KUBE_CONFIG is a base64-encoded kubeconfig for the target cluster,
  #    added as a repo secret; nothing in this job assumes any specific
  #    cluster provider. ──────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [helm-validate, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.4"

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: helm upgrade --install
        run: |
          helm upgrade --install kavach helm/kavach \
            --namespace kavach --create-namespace \
            --set api.image.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }} \
            --set api.image.tag=sha-${{ github.sha }} \
            --set workers.image.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }} \
            --set workers.image.tag=sha-${{ github.sha }} \
            --set beat.image.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }} \
            --set beat.image.tag=sha-${{ github.sha }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=sha-${{ github.sha }} \
            --set secrets.existingSecret=${{ vars.KAVACH_SECRET_NAME || 'kavach-secrets' }} \
            --wait --timeout 10m

      - name: helm test
        run: helm test kavach --namespace kavach
