{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kavach.secretName" . }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DATABASE_URL embeds the Postgres password, so it lives here rather
  # than the ConfigMap even though most of its shape is non-secret.
  # REDIS_URL has no secret material of its own (no auth configured on
  # the in-chart Redis) but is kept alongside it anyway — see
  # configmap.yaml's comment for why.
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.auth.username }}:{{ .Values.secrets.postgresPassword }}@{{ include "kavach.postgresHost" . }}:5432/{{ .Values.postgres.auth.database }}"
  REDIS_URL: "redis://{{ include "kavach.redisHost" . }}:6379/0"

  APP_SECRET_KEY: {{ .Values.secrets.appSecretKey | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}

  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}

  NVD_API_KEY: {{ .Values.secrets.nvdApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}

  OAUTH2_CLIENT_ID: {{ .Values.secrets.oauth2ClientId | quote }}
  OAUTH2_CLIENT_SECRET: {{ .Values.secrets.oauth2ClientSecret | quote }}

  LDAP_BIND_DN: {{ .Values.secrets.ldapBindDn | quote }}
  LDAP_BIND_PASSWORD: {{ .Values.secrets.ldapBindPassword | quote }}

  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  EMAIL_SMTP_USERNAME: {{ .Values.secrets.emailSmtpUsername | quote }}
  EMAIL_SMTP_PASSWORD: {{ .Values.secrets.emailSmtpPassword | quote }}
  WEBHOOK_URL: {{ .Values.secrets.webhookUrl | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}

  # Postgres StatefulSet's own POSTGRES_PASSWORD env var reads this same
  # key — one value, used both to initialize Postgres and to build
  # DATABASE_URL above, so they can never drift apart.
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
