apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kavach.fullname" . }}-test-connection
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readiness-check
      image: curlimages/curl:8.10.1
      # Waits (curl --retry) for the API to become fully ready (DB+Redis
      # reachable, not just the process being up) rather than a single
      # attempt racing the rollout — `helm test` typically runs right
      # after `helm install`, before pods necessarily have their readiness
      # probes passing yet.
      command:
        - sh
        - -c
        - |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused \
            "http://{{ include "kavach.fullname" . }}-api:{{ .Values.api.service.port }}/health/ready"
