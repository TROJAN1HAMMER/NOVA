{{- if .Values.flower.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kavach.fullname" . }}-flower
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kavach.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flower
  template:
    metadata:
      labels:
        {{- include "kavach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: flower
    spec:
      containers:
        - name: flower
          image: "{{ .Values.flower.image.repository }}:{{ .Values.flower.image.tag }}"
          imagePullPolicy: {{ .Values.flower.image.pullPolicy }}
          env:
            - name: CELERY_BROKER_URL
              value: "redis://{{ include "kavach.redisHost" . }}:6379/0"
          ports:
            - name: http
              containerPort: 5555
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kavach.fullname" . }}-flower
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  type: {{ .Values.flower.service.type }}
  selector:
    {{- include "kavach.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: flower
  ports:
    - name: http
      port: {{ .Values.flower.service.port }}
      targetPort: http
{{- end }}
