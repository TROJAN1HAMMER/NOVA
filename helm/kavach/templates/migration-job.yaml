{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kavach.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # post-install (not pre-install!) + pre-upgrade — asymmetric on
    # purpose, confirmed necessary by actually running this against a
    # real cluster: on a fresh install, Postgres is created by this SAME
    # `helm install` (the in-chart StatefulSet), not before it, so a
    # pre-install hook's Postgres-readiness wait deadlocks forever — there
    # is nothing left to ever create the Postgres it's waiting for, since
    # hooks by definition run before the release's other resources exist.
    # post-install runs after those resources exist (the StatefulSet
    # object, even if its pod is still starting — this job's own
    # wait-for-postgres initContainer's pg_isready retry loop handles that
    # part fine). On an upgrade, Postgres already exists from the prior
    # release, so pre-upgrade (migrate before the new app version's
    # Deployments roll out) is the correct, safe timing there.
    #
    # Trade-off accepted: on a brand-new install only, api/worker pods
    # (also created in that same install) could theoretically start
    # before this hook finishes migrating, since Kubernetes doesn't
    # sequence a Deployment's pods against a same-install Job the way
    # Helm sequences hooks against each other. In practice this window is
    # small (seconds), self-resolves on the pods' own crash/retry loop if
    # they do hit a missing-table error, and every subsequent
    # upgrade/restart is unaffected — accepting this beats the permanent
    # deadlock the previous ordering had on first install.
    #
    # Named per-revision (see metadata.name above) since Jobs are
    # immutable — `helm upgrade` can't reuse the previous revision's Job
    # object — and hook-succeeded/hook-failed deletion policies below
    # keep old ones from piling up.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "kavach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "kavach.postgresHost" . }} -p 5432 -U {{ .Values.postgres.auth.username }}; do echo waiting for postgres; sleep 2; done
      containers:
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            {{- include "kavach.envFrom" . | nindent 12 }}
{{- end }}
