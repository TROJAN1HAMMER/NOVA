# Source: kavach/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kavach-config
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
data:
  # REDIS_URL lives in the Secret, not here, even though the in-chart
  # Redis has no auth configured (so it carries no secret material of its
  # own): when postgres.enabled/redis.enabled are false — using external
  # managed services instead — secrets.existingSecret is expected to
  # supply *both* DATABASE_URL and REDIS_URL together, so an operator
  # overriding one connection string always overrides the other the same
  # way, in the same place. See templates/secret.yaml.

  APP_ENV: "production"
  DEBUG: "false"
  UPLOAD_DIR: "/app/uploads"
  REPORTS_DIR: "/app/reports"
  DATA_DIR: "/app/data"

  AI_MODE: "hybrid"
  AI_PROVIDER_PRIORITY: "auto"
  ANTHROPIC_MODEL: "claude-sonnet-5"
  OPENAI_MODEL: "gpt-4o-mini"
  GEMINI_MODEL: "gemini-1.5-flash"
  OLLAMA_BASE_URL: ""
  OLLAMA_MODEL: ""
  VLLM_BASE_URL: ""
  VLLM_MODEL: ""

  REPORT_STORAGE_BACKEND: "local"
  S3_ENDPOINT_URL: ""
  S3_BUCKET: "kavach-reports"
  S3_REGION: "us-east-1"
  S3_USE_PATH_STYLE: "true"

  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  OAUTH2_ENABLED: "false"
  OAUTH2_AUTHORIZE_URL: ""
  OAUTH2_TOKEN_URL: ""
  OAUTH2_USERINFO_URL: ""
  OAUTH2_REDIRECT_URI: ""
  OAUTH2_SCOPE: "openid email profile"

  LDAP_ENABLED: "false"
  LDAP_SERVER_URL: ""
  LDAP_USER_SEARCH_BASE: ""
  LDAP_USER_SEARCH_FILTER: "(uid={username})"
  LDAP_EMAIL_ATTRIBUTE: "mail"
  LDAP_FULL_NAME_ATTRIBUTE: "cn"
  LDAP_USE_SSL: "false"

  SAML_ENABLED: "false"
  SAML_IDP_METADATA_URL: ""
  SAML_IDP_ENTITY_ID: ""
  SAML_SP_ENTITY_ID: "kavach"
  SAML_ACS_URL: ""

  ALLOWED_ORIGINS: "https://kavach.example.com"
