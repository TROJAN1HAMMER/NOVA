# Source: kavach/templates/beat-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavach-beat
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: beat
spec:
  # Hardcoded, not a value: Celery Beat must never run more than one
  # instance at a time (two schedulers would both fire the periodic
  # stalled-job sweep independently, running it twice concurrently).
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: with replicas=1, a rolling update would
    # briefly run the old and new beat pods at once — the exact scenario
    # the single-replica constraint above exists to prevent. Recreate
    # guarantees the old pod is fully gone before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kavach
      app.kubernetes.io/instance: kavach
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavach
        app.kubernetes.io/instance: kavach
        app.kubernetes.io/component: beat
    spec:
      containers:
        - name: beat
          image: "kavach-backend:latest"
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - celery_worker.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: kavach-config
            - secretRef:
                name: kavach-secrets
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
