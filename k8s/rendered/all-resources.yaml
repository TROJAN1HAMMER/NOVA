# Source: kavach/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kavach-worker-default
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker-default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kavach-worker-default
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # Scanning is bursty (a batch of repos submitted at once) — scale up
    # fast, but scale down cautiously so a brief lull between bursts
    # doesn't thrash worker pods that'll just be needed again in a minute.
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
