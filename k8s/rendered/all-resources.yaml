# Source: kavach/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: kavach-test-connection
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readiness-check
      image: curlimages/curl:8.10.1
      # Waits (curl --retry) for the API to become fully ready (DB+Redis
      # reachable, not just the process being up) rather than a single
      # attempt racing the rollout — `helm test` typically runs right
      # after `helm install`, before pods necessarily have their readiness
      # probes passing yet.
      command:
        - sh
        - -c
        - |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused \
            "http://kavach-api:8000/health/ready"
