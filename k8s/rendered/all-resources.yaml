# Source: kavach/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavach-api
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kavach
      app.kubernetes.io/instance: kavach
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavach
        app.kubernetes.io/instance: kavach
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-migrations
          # The migration Job (templates/migration-job.yaml) is a Helm
          # pre-install/pre-upgrade hook, so it's already run to
          # completion before this Deployment's rollout even starts under
          # normal `helm upgrade` — this initContainer is a second,
          # cheaper line of defense against the API starting against a
          # schema migrations haven't reached yet (e.g. someone
          # `kubectl apply`s a rendered manifest directly, bypassing Helm
          # hooks entirely).
          image: "postgres:16-alpine"
          command:
            - sh
            - -c
            - until pg_isready -h kavach-postgres -p 5432 -U kavach; do echo waiting for postgres; sleep 2; done
      containers:
        - name: api
          image: "kavach-backend:latest"
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kavach-config
            - secretRef:
                name: kavach-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: reports
              mountPath: /app/reports
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: kavach-uploads
        - name: reports
          emptyDir: {}
