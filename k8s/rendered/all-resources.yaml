# Source: kavach/templates/worker-critical-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavach-worker-critical
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker-critical
spec:
  # Dedicated, always-on capacity for kavach.critical/kavach.high — no
  # autoscaling block, deliberately (see values.yaml's comment): the
  # point of this pool is guaranteed capacity that a backlog of low-
  # priority scans can never eat into, not elastic scale.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kavach
      app.kubernetes.io/instance: kavach
      app.kubernetes.io/component: worker-critical
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavach
        app.kubernetes.io/instance: kavach
        app.kubernetes.io/component: worker-critical
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: worker-critical
          image: "kavach-backend:latest"
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - celery_worker.celery_app
            - worker
            - --loglevel=info
            - --queues=kavach.critical,kavach.high
            - --concurrency=4
            - --hostname=critical@%h
          envFrom:
            - configMapRef:
                name: kavach-config
            - secretRef:
                name: kavach-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: reports
              mountPath: /app/reports
          # No HTTP port — Celery workers aren't network servers. Liveness
          # is a `celery inspect ping` against this specific worker's own
          # hostname, which round-trips through the real broker connection
          # (a stuck/disconnected worker fails this, not just a crashed
          # process — the thing that actually matters for a task queue).
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # --hostname=critical@%h above means this worker's own
                # Celery node name is "critical@<pod hostname>" — %h has
                # no real search-domain suffix to add inside a container,
                # so it matches plain `hostname` here. Targeting our own
                # node name specifically (not a broadcast ping) is what
                # makes this a check of *this* pod, not "is any worker on
                # the broker alive".
                - "celery -A celery_worker.celery_app inspect ping --destination=critical@$(hostname) --timeout=10 | grep -q OK"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: kavach-uploads
        - name: reports
          emptyDir: {}
