apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kavach-redis
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
spec:
  serviceName: kavach-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kavach
      app.kubernetes.io/instance: kavach
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavach
        app.kubernetes.io/instance: kavach
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          # --appendonly yes: Celery uses Redis as both broker and result
          # backend (see app/workers/celery_app.py) — an unpersisted Redis
          # losing queued-but-not-yet-picked-up tasks on a pod restart
          # would silently drop in-flight scans, so this trades a little
          # write throughput for not doing that.
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "5Gi"
