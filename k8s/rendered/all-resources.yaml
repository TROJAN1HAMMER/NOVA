# Source: kavach/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kavach-migrate-1
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migration
  annotations:
    # Runs before any workload that expects the new schema is rolled out,
    # on both first install and every upgrade. Named per-revision (see
    # metadata.name above) since Jobs are immutable — `helm upgrade` can't
    # reuse the previous revision's Job object, and hook-succeeded/
    # hook-failed deletion policies below keep old ones from piling up.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavach
        app.kubernetes.io/instance: kavach
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: "postgres:16-alpine"
          command:
            - sh
            - -c
            - until pg_isready -h kavach-postgres -p 5432 -U kavach; do echo waiting for postgres; sleep 2; done
      containers:
        - name: migrate
          image: "kavach-backend:latest"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: kavach-config
            - secretRef:
                name: kavach-secrets
