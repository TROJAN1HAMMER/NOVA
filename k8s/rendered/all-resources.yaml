# Source: kavach/templates/postgres-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kavach-postgres
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  serviceName: kavach-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kavach
      app.kubernetes.io/instance: kavach
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavach
        app.kubernetes.io/instance: kavach
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "kavach"
            - name: POSTGRES_DB
              value: "kavach_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kavach-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kavach", "-d", "kavach_db"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kavach", "-d", "kavach_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "20Gi"
