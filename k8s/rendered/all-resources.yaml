# Source: kavach/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kavach-secrets
  labels:
    helm.sh/chart: kavach-0.1.0
    app.kubernetes.io/name: kavach
    app.kubernetes.io/instance: kavach
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  # DATABASE_URL embeds the Postgres password, so it lives here rather
  # than the ConfigMap even though most of its shape is non-secret.
  # REDIS_URL has no secret material of its own (no auth configured on
  # the in-chart Redis) but is kept alongside it anyway — see
  # configmap.yaml's comment for why.
  DATABASE_URL: "postgresql+asyncpg://kavach:change-me@kavach-postgres:5432/kavach_db"
  REDIS_URL: "redis://kavach-redis:6379/0"

  APP_SECRET_KEY: "change-me-32-chars-minimum-please"
  JWT_SECRET_KEY: "change-me-jwt-32chars-minimum-please"

  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""

  NVD_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""

  OAUTH2_CLIENT_ID: ""
  OAUTH2_CLIENT_SECRET: ""

  LDAP_BIND_DN: ""
  LDAP_BIND_PASSWORD: ""

  # Postgres StatefulSet's own POSTGRES_PASSWORD env var reads this same
  # key — one value, used both to initialize Postgres and to build
  # DATABASE_URL above, so they can never drift apart.
  POSTGRES_PASSWORD: "change-me"
