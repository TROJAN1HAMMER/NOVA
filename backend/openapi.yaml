      - AI Assistant
      summary: Chat
      description: "Server-Sent Events stream. Event sequence:\n  \"retrieval\"  \
        \         \u2014 always sent first: retrieved_count, confidence,\n       \
        \                    and the full citation list (document, page,\n       \
        \                    section, similarity score, excerpt).\n  \"insufficient_context\"\
        \ \u2014 sent INSTEAD of any \"token\" events when the\n                 \
        \          confidence gate fails; the LLM is never\n                     \
        \      called in this case.\n  \"token\"                \u2014 one or more,\
        \ the streamed answer text.\n  \"done\"                 \u2014 always sent\
        \ last (after \"token\"s, never after\n                           \"insufficient_context\"\
        ): confidence,\n                           retrieved_count, latency_ms.\n\
        \  \"error\"                 \u2014 only if the stream fails part-way through."
      operationId: chat_api_v1_assistant_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
