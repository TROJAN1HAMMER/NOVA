  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: Platform health check endpoint.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
  /health/live:
    get:
      tags:
      - Health
      summary: Liveness
      description: "Kubernetes liveness probe target: is the process itself alive\
        \ and\nable to handle a request at all? Deliberately checks nothing beyond\n\
        that \u2014 a Postgres or Redis outage must not make kubelet kill and\nrestart\
        \ otherwise-healthy API pods (that would turn a dependency\noutage into a\
        \ self-inflicted restart storm on top of it). That\ndistinction is exactly\
        \ what `/health/ready` is for instead."
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Liveness Health Live Get
  /health/ready:
    get:
      tags:
      - Health
      summary: Readiness
      description: "Kubernetes readiness probe target: can this pod actually serve\
        \ a\nrequest right now? Checks Postgres and Redis are reachable \u2014 a pod\n\
        that fails this is taken out of Service load-balancing (not killed,\nunlike\
        \ a liveness failure) until it passes again, which is the\ncorrect response\
        \ to \"my dependency is temporarily down\" rather than\n\"I am broken and\
        \ need a restart\"."
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readiness Health Ready Get
  /metrics:
    get:
      tags:
      - Observability
      summary: Metrics
      description: 'Prometheus scrape target. See app/core/metrics.py''s module docstring

        for why HTTP metrics are recorded in-process (by MetricsMiddleware)

        while business/scanner metrics are computed fresh from Postgres/Redis

        right here, on every scrape, instead.'
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      tags:
      - Health
      summary: Root
      description: "Root endpoint \u2014 redirects clients to API docs."
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
components:
  schemas:
    ActiveStatusUpdateRequest:
      properties:
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - is_active
      title: ActiveStatusUpdateRequest
    AuditLogEntryResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        user_email:
          anyOf:
          - type: string
          - type: 'null'
          title: User Email
        action:
          type: string
          title: Action
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        status:
          type: string
          title: Status
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - action
      - status
      - created_at
      title: AuditLogEntryResponse
    AuditLogListResponse:
      properties:
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
        entries:
          items:
            $ref: '#/components/schemas/AuditLogEntryResponse'
          type: array
          title: Entries
      type: object
      required:
      - total
      - limit
      - offset
      - entries
      title: AuditLogListResponse
    AuthProvider:
      type: string
      enum:
      - local
      - oauth2
      - saml
      - ldap
      title: AuthProvider
      description: "How a user's identity was established \u2014 see app/auth/sso/."
    BenchmarkResultSchema:
      properties:
        ran_at:
          type: string
          title: Ran At
        stages:
          items:
            $ref: '#/components/schemas/BenchmarkStageSchema'
          type: array
          title: Stages
        total_duration_ms:
          type: number
          title: Total Duration Ms
        documents_indexed:
          type: integer
          title: Documents Indexed
        llm_configured:
          type: boolean
          title: Llm Configured
      type: object
      required:
      - ran_at
      - stages
      - total_duration_ms
      - documents_indexed
      - llm_configured
      title: BenchmarkResultSchema
    BenchmarkStageSchema:
      properties:
        stage:
          type: string
          title: Stage
        avg_duration_ms:
          type: number
          title: Avg Duration Ms
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - stage
