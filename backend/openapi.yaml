tags:
- name: Health
  description: "Liveness/readiness probes \u2014 no authentication required."
- name: Observability
  description: Prometheus metrics scrape endpoint.
- name: Repositories
  description: Repositories KAVACH has scanned, from a URL submission, an archive
    upload, or a GitHub webhook push.
- name: Scanning
  description: Submit a scan (URL, archive upload, or sandbox demo), track its progress
    (poll or WebSocket), and retrieve its findings/compliance results.
- name: Webhooks
  description: "Inbound webhook receivers \u2014 currently GitHub push events. The\
    \ first step of the automated pipeline: a verified push creates and dispatches\
    \ a scan job with no user interaction."
- name: Reports
  description: Generated report artifacts (PDF, SARIF, SBOM, CSV, compliance report,
    unified findings JSON) for a completed scan.
- name: Risk Configuration
  description: Business-module classification and BRS factor-weight configuration
    that drives the Risk Engine's scoring.
- name: Auth
  description: "Local email/password authentication \u2014 register, log in, refresh,\
    \ and read the current user."
- name: "Auth \u2014 SSO"
  description: OAuth2/OIDC, LDAP, and SAML single sign-on flows.
- name: "Auth \u2014 Admin"
  description: "User role/status management and audit-log querying \u2014 admin-only."
