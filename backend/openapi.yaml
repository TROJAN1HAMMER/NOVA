openapi: 3.1.0
info:
  title: "KAVACH \u2014 AI-Powered DevSecOps Platform"
  description: "KAVACH scans banking application repositories for vulnerabilities,\
    \ calculates a Banking Risk Score (BRS), maps findings to regulatory controls\
    \ (RBI / PCI-DSS / SWIFT), and generates AI-powered audit reports.\n\n## Pipeline\n\
    `GitHub webhook` \u2192 `Create Scan Job` \u2192 `Queue` \u2192 `Distributed workers`\
    \ \u2192 `Aggregation` \u2192 `Risk Engine` \u2192 `Compliance Engine` \u2192\
    \ `AI Explanation` \u2192 `Reports` \u2192 `Dashboard` \u2192 `Notifications`\
    \ \u2192 `Archive`\n\nA scan enters this pipeline either via `POST /scan/repository`\
    \ / `POST /scan` (an authenticated user submitting a URL or archive) or `POST\
    \ /webhooks/github` (an unauthenticated, HMAC-verified push event) \u2014 both\
    \ converge on the same queue \u2192 distributed-worker \u2192 aggregation path,\
    \ so everything downstream behaves identically regardless of how the scan was\
    \ triggered."
  contact:
    name: KAVACH Platform Team
    url: https://github.com/kavach-platform/kavach
  license:
    name: "Proprietary \u2014 All Rights Reserved"
  version: 1.0.0
paths:
  /api/v1/repositories:
    get:
      tags:
      - Repositories
      summary: List Repositories
      description: List the current user's submitted repositories (upload targets
        and repo-URL submissions alike).
      operationId: list_repositories_api_v1_repositories_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryResponse'
                title: Response List Repositories Api V1 Repositories Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/repositories/{repository_id}/scheduled-scan:
    patch:
      tags:
      - Repositories
      summary: Update Scheduled Scan
      description: "Opt a repository in to (or out of) nightly re-scanning \u2014\
        \ see\napp/tasks/scheduled_scan_tasks.py. Only URL-based repositories can\
        \ be\nscheduled: a one-time zip upload has no re-fetchable source for a\n\
        later re-scan to run against."
      operationId: update_scheduled_scan_api_v1_repositories__repository_id__scheduled_scan_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Repository Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledScanUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan:
    post:
      tags:
      - Scanning
      summary: Upload Repo
      description: Upload a repository ZIP file to start a DevSecOps scan.
      operationId: upload_repo_api_v1_scan_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_repo_api_v1_scan_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Scanning
      summary: List Scan Jobs
      description: List the current user's scan jobs, optionally filtered by status.
      operationId: list_scan_jobs_api_v1_scan_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ScanJobStatus'
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan/repository:
    post:
      tags:
      - Scanning
      summary: Submit Repository
      description: "Submit a repository by URL: validate it, resolve (or reuse) its\n\
        Repository row, create a queued ScanJob, and return immediately. The\narchive\
        \ download and the 9-scanner fan-out run asynchronously \u2014 see\napp/tasks/scan_tasks.py.\
        \ Submitting the same URL again reuses the same\nRepository row (see app/services/scan_intake.py)\
        \ rather than creating\na duplicate."
      operationId: submit_repository_api_v1_scan_repository_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanJobSubmitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/scan/premade/{risk_level}:
    post:
      tags:
      - Scanning
      summary: Trigger Premade Scan
      description: 'Trigger a scan for one of the pre-made benchmark repositories:
        very_low, low, medium, high, or critical.'
      operationId: trigger_premade_scan_api_v1_scan_premade__risk_level__post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: risk_level
        in: path
        required: true
        schema:
          type: string
          title: Risk Level
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan/{scan_job_id}:
    get:
      tags:
      - Scanning
      summary: Get Scan Job Status
      description: Get the current status/progress of a scan job, including BRS and
        Attack Surface Exposure scores once completed.
      operationId: get_scan_job_status_api_v1_scan__scan_job_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan/{scan_job_id}/cancel:
    post:
      tags:
      - Scanning
      summary: Cancel Scan Job
      description: "Request cancellation. A QUEUED job is cancelled outright. A RUNNING\n\
        job gets two things: every in-flight scanner task (semgrep, ast-grep,\netc.)\
        \ is revoked via Celery's control plane \u2014 `terminate=True` sends\nSIGTERM\
        \ to a task already executing, not just a \"don't start\" marker\nfor one\
        \ still queued \u2014 and a Redis flag is set that each scanner task\nalso\
        \ checks cooperatively at its own start, in case a task is\nrevoked before\
        \ it's even been picked up by a worker. Jobs already in\na terminal state\
        \ are returned unchanged."
      operationId: cancel_scan_job_api_v1_scan__scan_job_id__cancel_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan/{scan_job_id}/findings:
    get:
      tags:
      - Scanning
      summary: Get Scan Job Findings
      description: Retrieve all findings for a given scan job, including AI insights
        and compliance mappings.
      operationId: get_scan_job_findings_api_v1_scan__scan_job_id__findings_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan/{scan_job_id}/compliance:
    get:
      tags:
      - Scanning
      summary: Get Scan Job Compliance
      description: "Live PCI DSS v4.0 / RBI IT Framework / SWIFT CSP compliance evaluation,\n\
        recomputed on demand from this scan's persisted findings rather than a\nfrozen\
        \ snapshot. Because the rule catalog is YAML\n(app/data/compliance_rules/),\
        \ editing a rule file changes this\nendpoint's answer immediately without\
        \ re-running the scan \u2014 the\nfrozen point-in-time record from when the\
        \ scan actually completed is\nthe downloadable 'compliance_report' artifact\
        \ instead\n(GET /reports/{scan_job_id}/download/compliance_report)."
      operationId: get_scan_job_compliance_api_v1_scan__scan_job_id__compliance_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceEngineResultSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scan/{scan_job_id}/findings/{finding_id}/explain/stream:
    get:
      tags:
      - Scanning
      summary: Stream Finding Explanation
      description: "Server-Sent Events stream of an AI-generated, plain-prose explanation\n\
        for a single finding (see `ai_engine.explain_vulnerability_stream`).\n\nProvider\
        \ selection follows `AI_MODE` (see app/config.py): in the\ndefault \"hybrid\"\
        \ mode, a local Ollama/vLLM model is tried first and\ncloud providers (Claude/OpenAI/Gemini)\
        \ are the fallback if no local\nmodel is reachable \u2014 \"local\" or \"\
        cloud\" modes restrict to just one\nside. Emits a single `error` event (not\
        \ an HTTP error) if no provider\nis configured or reachable, since the connection\
        \ is already open as\nan event stream at that point; the non-streaming\n`GET\
        \ /scan/{scan_job_id}/findings` endpoint always has a deterministic\ntemplate\
        \ answer regardless of AI availability, if a caller needs a\nguaranteed non-empty\
        \ explanation instead of best-effort streaming."
      operationId: stream_finding_explanation_api_v1_scan__scan_job_id__findings__finding_id__explain_stream_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Finding Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/webhooks/github:
    post:
      tags:
      - Webhooks
      - Webhooks
      summary: GitHub push event receiver
      description: "Handles two GitHub event types:\n\n- `ping` \u2014 sent once when\
        \ the webhook is first configured, to let\n  GitHub confirm the endpoint is\
        \ reachable and signs correctly.\n  Acknowledged without creating a scan.\n\
        - `push` \u2014 the trigger. Resolves (or reuses) the pushed repository's\n\
        \  `Repository` row, creates a queued `ScanJob` for the pushed branch,\n \
        \ and dispatches it exactly like `POST /scan/repository` \u2014 the rest\n\
        \  of the pipeline (workers, aggregation, risk/compliance/AI, reports,\n \
        \ notifications, archive) runs identically regardless of how the scan\n  was\
        \ triggered.\n\nEvery other event type (`pull_request`, `issues`, `star`,\
        \ ...) is\nacknowledged with 200 and a `status: \"ignored\"` body rather than\n\
        erroring \u2014 GitHub retries/disables a webhook that responds with\nnon-2xx\
        \ too often, and subscribing to more events than intended on\nthe GitHub side\
        \ shouldn't be able to break delivery for the ones that\nmatter.\n\nResponds\
        \ fast (queues the job, does not wait for it): GitHub expects\na response\
        \ within 10 seconds and will consider the delivery failed\n(and may retry)\
        \ otherwise."
      operationId: github_webhook_api_v1_webhooks_github_post
      parameters:
      - name: x-hub-signature-256
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Hub-Signature-256
      - name: x-github-event
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Github-Event
      responses:
        '200':
          description: Whether a scan was queued, ignored, or the delivery was just
            a ping check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/{scan_job_id}:
    get:
      tags:
      - Reports
      summary: Get Report Status
      description: Check which reports are ready for download for a given scan job,
        and the status of any still in progress.
      operationId: get_report_status_api_v1_reports__scan_job_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPathsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/{scan_job_id}/download/{report_type}:
    get:
      tags:
      - Reports
      summary: Download Report
      description: 'Download a specific generated report. For the "s3" storage backend

        this redirects (307) to a short-lived presigned URL rather than

        streaming the file through this process; for "local" it streams the

        file directly, unchanged from before S3 support existed.'
      operationId: download_report_api_v1_reports__scan_job_id__download__report_type__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: scan_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Job Id
      - name: report_type
        in: path
        required: true
        schema:
          type: string
          title: Report Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/risk/modules:
    get:
      tags:
      - Risk Configuration
      summary: List Business Modules
      description: "List every configured business module \u2014 the DB-driven replacement\
        \ for the old hardcoded MODULE_WEIGHTS."
      operationId: list_business_modules_api_v1_risk_modules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BusinessModuleResponse'
                type: array
                title: Response List Business Modules Api V1 Risk Modules Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Risk Configuration
      summary: Create Business Module
      description: "Add a new business module \u2014 this is what 'fully extensible'\
        \ means in practice: no code change, no deploy."
      operationId: create_business_module_api_v1_risk_modules_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessModuleCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessModuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/risk/modules/{module_name}:
    patch:
      tags:
      - Risk Configuration
      summary: Update Business Module
      description: "Adjust a module's weights/keywords \u2014 takes effect on the\
        \ very next scan, no deploy."
      operationId: update_business_module_api_v1_risk_modules__module_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: module_name
        in: path
        required: true
        schema:
          type: string
          title: Module Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessModuleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessModuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Risk Configuration
      summary: Delete Business Module
      description: "Remove a module. The fallback ('General', is_default=True) can't\
        \ be deleted \u2014 scoring needs\nsomewhere to land a finding that matches\
        \ no other module's keywords."
      operationId: delete_business_module_api_v1_risk_modules__module_name__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: module_name
        in: path
        required: true
        schema:
          type: string
          title: Module Name
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/risk/factor-weights:
    get:
      tags:
      - Risk Configuration
      summary: List Risk Factor Weights
      description: List every factor's weight in the BRS blend (CVSS, exploitability,
        business criticality, ...).
      operationId: list_risk_factor_weights_api_v1_risk_factor_weights_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RiskFactorWeightResponse'
                type: array
                title: Response List Risk Factor Weights Api V1 Risk Factor Weights
                  Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/risk/factor-weights/{factor_name}:
    patch:
      tags:
      - Risk Configuration
      summary: Update Risk Factor Weight
      description: "Set a factor's weight \u2014 0 disables it entirely (the blend\
        \ normalizes\nby the sum of active weights, so this is safe). Upserts: naming\
        \ a\nfactor that doesn't exist yet creates it, which is how a newly\ncode-added\
        \ factor (see brs_engine.py's registry note) gets its\ndefault weight without\
        \ a migration."
      operationId: update_risk_factor_weight_api_v1_risk_factor_weights__factor_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: factor_name
        in: path
        required: true
        schema:
          type: string
          title: Factor Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskFactorWeightUpsertRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskFactorWeightResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/risk/preview:
    post:
      tags:
      - Risk Configuration
      summary: Preview Score
      description: "Score a synthetic finding against the *current* database configuration\n\
        \u2014 the concrete way to see what changing a module's criticality_weight\n\
        or a factor's weight actually does before it affects a real scan.\nReuses\
        \ brs_engine's own DB-loaders (repo-backed, falling back to\ndefaults if unconfigured)\
        \ rather than duplicating that logic here."
      operationId: preview_score_api_v1_risk_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScorePreviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorePreviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/analytics/my-activity:
    get:
      tags:
      - Analytics
      summary: Get My Activity
      description: "A user's own scan activity \u2014 always their own data, so any\n\
        authenticated active user can read it (no extra permission beyond\nbeing logged\
        \ in; there's nothing to over-privilege here)."
      operationId: get_my_activity_api_v1_analytics_my_activity_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyActivitySummary'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/analytics/team-activity:
    get:
      tags:
      - Analytics
      summary: Get Team Activity
      description: "Org-wide scan activity broken down per user \u2014 Security Manager/Admin\
        \ only."
      operationId: get_team_activity_api_v1_analytics_team_activity_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamActivitySummary'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/knowledge/upload:
    post:
      tags:
      - Knowledge Base
      summary: Upload Document
      description: "Upload a PDF/Markdown/text document. Returns immediately with\
        \ status\n\"pending\" \u2014 extraction/chunking/embedding runs asynchronously;\
        \ poll\nGET /knowledge/documents to see it advance to \"indexed\" (or \"failed\"\
        ).\n`tags` is a comma-separated string, e.g. \"pci-dss,payments\"."
      operationId: upload_document_api_v1_knowledge_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_api_v1_knowledge_upload_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/knowledge/documents:
