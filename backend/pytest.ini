[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
; One event loop for the whole session, not one per test function — the
; async engine/connection pool (app/db/session.py) is a process-wide
; singleton, and asyncpg connections are bound to the loop that created
; them. A fresh per-test loop (pytest-asyncio's default) tears down
; mid-session with pooled connections still open on a now-closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: exercises real Postgres/Redis/Celery (eager) end-to-end — see tests/integration/conftest.py
